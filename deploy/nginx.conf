user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    server_tokens off;
    access_log /var/log/nginx/access.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Requests proxied by Vercel all arrive from Vercel's IPs, so key the limit on the original client when present
    map $http_x_forwarded_for $chat_client {
        ""      $binary_remote_addr;
        default $http_x_forwarded_for;
    }
    limit_req_zone $chat_client zone=chat:10m rate=10r/m;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        root /opt/portfolio/site;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;

        location ~ /\. {
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(css|js|svg|png|jpg|webp|woff2)$ {
            expires 7d;
            add_header Cache-Control "public";
        }

        location /api/ {
            limit_req zone=chat burst=5 nodelay;
            limit_req_status 429;
            client_max_body_size 64k;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 40s;
        }
    }
}
